function render(){document.querySelector("#data").value=JSON.stringify(qs,null,2);
if(!qs.length){app.innerHTML='<div class="eyebrow">Your personal practice space</div><h1 class="heading">Ready to sharpen your ECE knowledge?</h1><p class="sub">Load your question set, then work through it one question at a time.</p><div class="stats"><div class="stat"><b>01</b><span>Question at a time</span></div><div class="stat"><b>∞</b><span>Practice at your pace</span></div><div class="stat"><b>✓</b><span>Score at the end</span></div></div><button class="primary" onclick="document.querySelector(\'#manage\').open=true;document.querySelector(\'#data\').focus()">Add my questions</button>';return}
if(idx>=qs.length){let score=answers.filter((v,i)=>v===ci(qs[i])).length,pct=Math.round(score/qs.length*100),title=pct===100?"Outstanding work!":pct>=80?"Great progress!":pct>=60?"Keep building!":"Good start!";app.innerHTML='<div class="score"><div class="eyebrow">Practice complete</div><h1 class="heading">'+title+'</h1><div class="ring" style="--pct:'+pct+'%"><div><b>'+pct+'%</b><span class="tiny">SCORE</span></div></div><p class="result-note">You got <strong>'+score+' of '+qs.length+'</strong> questions correct.</p></div><div class="stats"><div class="stat"><b>'+score+'</b><span>Correct</span></div><div class="stat"><b>'+(qs.length-score)+'</b><span>To review</span></div><div class="stat"><b>'+qs.length+'</b><span>Total</span></div></div><button class="primary" id="again">Practice again</button>';document.querySelector("#again").onclick=()=>{idx=0;answers=[];checked=false;render()};return}
let q=qs[idx],choice=answers[idx],answer=ci(q),pct=Math.round(idx/qs.length*100);app.innerHTML='<div class="qmeta"><span>QUESTION '+(idx+1)+' OF '+qs.length+'</span><span>'+pct+'% complete</span></div><div class="progress-line"><span style="width:'+pct+'%"></span></div><div class="eyebrow">Select one answer</div><h1 class="question">'+esc(q.question)+'</h1><div class="options">'+q.options.map((o,j)=>'<button class="option '+(choice===j?"selected ":"")+(checked&&j===answer?"correct ":"")+(checked&&choice===j&&choice!==answer?"incorrect":"")+'" data-i="'+j+'" '+(checked?"disabled":"")+'><span class="letter">'+String.fromCharCode(65+j)+'</span><span>'+esc(o)+'</span></button>').join("")+'</div>'+(checked?'<div class="feedback '+(choice===answer?"good":"bad")+'">'+(choice===answer?"Correct!":"Not quite. The correct answer is "+esc(q.options[answer])+".")+(q.explanation?"<br>"+esc(q.explanation):"")+'</div>':"")+'<div class="actions"><button class="secondary" id="back" '+(idx===0?"disabled":"")+'>Previous</button>'+(checked?'<button class="primary" id="next">'+(idx===qs.length-1?"See my score":"Next question")+'</button>':'<button class="primary" id="submit" '+(choice===undefined?"disabled":"")+'>Check answer</button>')+'</div>';
app.querySelectorAll(".option").forEach(b=>b.onclick=()=>{answers[idx]=Number(b.dataset.i);render()});document.querySelector("#submit")?.addEventListener("click",()=>{if(answers[idx]!==undefined){checked=true;render()}});document.querySelector("#next")?.addEventListener("click",()=>{idx++;checked=false;render()});document.querySelector("#back").onclick=()=>{if(idx>0){idx--;checked=false;render()}}}
document.querySelector("#save").onclick=()=>{let box=document.querySelector("#msg");try{let v=JSON.parse(document.querySelector("#data").value);if(!valid(v))throw Error("Each question needs at least two choices and a valid answer.");qs=v;originalQs=JSON.parse(JSON.stringify(v));idx=0;answers=[];checked=false;box.textContent="Saved "+qs.length+" questions for this session.";render()}catch(e){box.textContent="Could not save: "+e.message;box.style.color="var(--bad)"}};
document.querySelector("#sample").onclick=()=>{document.querySelector("#data").value=JSON.stringify(originalQs,null,2);document.querySelector("#msg").textContent="Restored the question set loaded for this session.";document.querySelector("#msg").style.color="var(--good)"};
document.querySelector("#homeBtn").onclick=()=>{if(!unlocked)return;unlocked=false;qs=[];originalQs=[];answers=[];checked=false;document.querySelector("#data").value="";document.querySelector("#homeBtn").textContent="Lock";lockScreen()};lockScreen();
</script></body></html>
